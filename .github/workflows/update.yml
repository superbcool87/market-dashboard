name: Update Financial Dashboard

on:
  schedule:
    - cron: '0 22 * * 0-4'   # 한국 시간 07:00 (월~금)
    - cron: '30 2 * * 1-5'   # 한국 시간 11:30 (월~금)
    - cron: '0 7 * * 1-5'    # 한국 시간 16:00 (월~금)
    - cron: '0 13 * * 1-5'   # 한국 시간 22:00 (월~금)
  workflow_dispatch:        # 수동 실행 버튼 활성화

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Data Collector & Build HTML
        run: |
          python build_dashboard.py

      - name: Commit and Push Updated Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market dashboard [skip ci]" && git push)
